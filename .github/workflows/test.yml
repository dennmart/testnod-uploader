name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Vet
        run: |
          go vet ./...
          go vet -tags debug ./...

      - name: Run tests
        run: go test ./... -v

      - name: Run tests (debug build)
        run: go test -tags debug ./... -v
