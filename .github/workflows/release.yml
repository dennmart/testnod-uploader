name: Release

on:
  push:
    tags:
      - "v*"

env:
  APP_NAME: testnod-uploader

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Get tag version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" \
              -o dist/${{ env.APP_NAME }}-$GOOS-$GOARCH$EXT ./cmd/testnod-uploader
          done

      - name: Create metadata files
        working-directory: dist
        run: |
          echo "${{ steps.version.outputs.VERSION }}" > VERSION
          sha256sum ${{ env.APP_NAME }}-* > checksums.txt

      - name: Upload to R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-linux-amd64 --file dist/${{ env.APP_NAME }}-linux-amd64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-linux-arm64 --file dist/${{ env.APP_NAME }}-linux-arm64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-darwin-amd64 --file dist/${{ env.APP_NAME }}-darwin-amd64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-darwin-arm64 --file dist/${{ env.APP_NAME }}-darwin-arm64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-windows-amd64.exe --file dist/${{ env.APP_NAME }}-windows-amd64.exe --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/${{ env.APP_NAME }}-windows-arm64.exe --file dist/${{ env.APP_NAME }}-windows-arm64.exe --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/VERSION --file dist/VERSION --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/${{ steps.version.outputs.VERSION }}/checksums.txt --file dist/checksums.txt --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}-linux-amd64 --file dist/${{ env.APP_NAME }}-linux-amd64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}-linux-arm64 --file dist/${{ env.APP_NAME }}-linux-arm64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}-darwin-amd64 --file dist/${{ env.APP_NAME }}-darwin-amd64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}-darwin-arm64 --file dist/${{ env.APP_NAME }}-darwin-arm64 --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}-windows-amd64.exe --file dist/${{ env.APP_NAME }}-windows-amd64.exe --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}-windows-arm64.exe --file dist/${{ env.APP_NAME }}-windows-arm64.exe --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/VERSION --file dist/VERSION --remote
            r2 object put ${{ secrets.R2_BUCKET }}/${{ env.APP_NAME }}/latest/checksums.txt --file dist/checksums.txt --remote
